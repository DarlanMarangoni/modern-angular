<mat-sidenav-container class="container">

  <mat-sidenav #sidenav mode="over">
    <mat-nav-list>
      <a mat-list-item routerLink="/" (click)="sidenav.close()">Home</a>
      <a mat-list-item routerLink="/despesas" (click)="sidenav.close()">Despesas</a>
      <a mat-list-item routerLink="/investimentos" (click)="sidenav.close()">Investimentos</a>
      <a mat-list-item routerLink="/proventos" (click)="sidenav.close()">Proventos</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>

    <mat-toolbar color="primary">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="logo">Finanças pessoais</span>

      <span class="spacer"></span>

      <button
        mat-icon-button
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.isDark() ? 'Ativar tema claro' : 'Ativar tema escuro'"
      >
        <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

    </mat-toolbar>

    <router-outlet></router-outlet>

  </mat-sidenav-content>

</mat-sidenav-container>

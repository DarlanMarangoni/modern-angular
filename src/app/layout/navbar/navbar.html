<p-toolbar styleClass="app-toolbar">
  <ng-template #start>
    <p-button
      icon="pi pi-bars"
      [text]="true"
      [rounded]="true"
      severity="secondary"
      ariaLabel="Abrir menu"
      (onClick)="drawerVisible = true"
    />
    <span class="logo">Finanças pessoais</span>
  </ng-template>

  <ng-template #end>
    <p-button
      [icon]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
      [text]="true"
      [rounded]="true"
      severity="secondary"
      [ariaLabel]="themeService.isDark() ? 'Ativar tema claro' : 'Ativar tema escuro'"
      (onClick)="themeService.toggle()"
    />
    @if (authService.isLoggedIn()) {
      <p-button
        icon="pi pi-sign-out"
        [text]="true"
        [rounded]="true"
        severity="secondary"
        ariaLabel="Sair"
        (onClick)="authService.logout()"
      />
    }
  </ng-template>
</p-toolbar>

<p-drawer [(visible)]="drawerVisible" position="left" header="Finanças pessoais">
  <nav class="nav-list">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="drawerVisible = false">Home</a>
    <a routerLink="/despesas" routerLinkActive="active" (click)="drawerVisible = false">Despesas</a>
    <a routerLink="/investimentos" routerLinkActive="active" (click)="drawerVisible = false">Investimentos</a>
    <a routerLink="/proventos" routerLinkActive="active" (click)="drawerVisible = false">Proventos</a>
  </nav>
</p-drawer>

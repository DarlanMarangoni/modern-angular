<div class="main-container">
  <form [formGroup]="form" (ngSubmit)="salvar()" class="form">
    <div class="title"><h2 style="text-align: center">Minhas Despesas</h2></div>
    <div class="container">
      <div class="field">
        <p-floatlabel variant="on">
          <input pInputText id="nome" formControlName="nome"/>
          <label for="nome">Nome</label>
        </p-floatlabel>
        @if (form.controls.nome.invalid &&
        (form.controls.nome.touched || form.controls.nome.dirty)) {
          <p-message severity="error" size="small" variant="simple">
            Nome é obrigatório
          </p-message>
        }
      </div>

      <div class="field">
        <p-floatlabel variant="on">
          <p-select inputId="categoria" formControlName="categoria" [options]="categorias()" optionLabel="name" optionValue="name"/>
          <label for="categoria">Categoria</label>
        </p-floatlabel>
      </div>

      <div class="field">
        <p-floatlabel variant="on">
          <input pInputText id="descricao" formControlName="descricao"/>
          <label for="descricao">Descrição</label>
        </p-floatlabel>
      </div>

      <div class="field">
        <p-floatlabel variant="on">
          <p-datepicker inputId="data" formControlName="data" dateFormat="dd/mm/yy" [showIcon]="true" iconDisplay="input"/>
          <label for="data">Data</label>
        </p-floatlabel>
      </div>

      <div class="field">
        <p-floatlabel variant="on">
          <p-inputnumber inputId="valor" formControlName="valor" mode="currency" currency="BRL" locale="pt-BR"/>
          <label for="valor">Valor</label>
        </p-floatlabel>
      </div>
    </div>
    <div class="container">
      <p-button label="Salvar Despesa" type="submit"/>
    </div>
  </form>
</div>
<div class="table-container" id="table-expense">
  <app-table [values]="despesas()"
             [headers]="['Nome', 'Categoria', 'Valor', 'Data']"
             [title]="'Despesas'"
             [fields]="['name', 'description', 'value', 'date']"
             (deleteItem)="deleteById($event)"/>
</div>
